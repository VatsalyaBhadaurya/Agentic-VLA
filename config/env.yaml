# LIBERO environment configuration.
# Values tagged [TO-VERIFY] are confirmed/overwritten by scripts/00_verify_interfaces.py.

suite: libero_object            # starting suite (DESIGN.md §13)
task_id: 0                      # index within the suite; null => iterate all
max_steps: 600                  # hard episode cap (bounded loop, spec §9)

cameras:
  # Names MUST match what the SmolVLA checkpoint was trained with. [TO-VERIFY]
  - agentview
  - robot0_eye_in_hand
image_size: 256                 # [TO-VERIFY] against installed LIBERO + checkpoint

control:
  frequency_hz: 20              # [TO-VERIFY] LIBERO control freq
  controller: OSC_POSE          # [TO-VERIFY]

action_space:
  dim: 7                        # [TO-VERIFY] [dx,dy,dz,drx,dry,drz,gripper]
  low: -1.0
  high: 1.0
  gripper_close_sign: 1.0       # [TO-VERIFY] +1 close / -1 open (or inverse)

seeds: [0, 1, 2]                # evaluation seeds (consistent across configs A/B/C)
